<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Priority Manager | Matrix Schedule</title>
    <meta name="description" content="View tasks grouped by deadline and sorted by their computed priority score.">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <nav class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-check-circle"></i>
            TaskMaster
        </div>
        <ul class="nav-links">
            <li><a href="/" class="nav-item" id="nav-dashboard"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="/?add=true" class="nav-item" id="nav-task"><i class="ph ph-plus-circle"></i> Add Task</a></li>
            <li><a href="/schedule.html" class="nav-item active" id="nav-schedule"><i class="ph ph-calendar-check"></i> Matrix Schedule</a></li>
            <li><a href="/history.html" class="nav-item" id="nav-history"><i class="ph ph-clock-counter-clockwise"></i> History</a></li>
        </ul>
        <div style="margin-top: auto; padding: 1rem; border-top: 1px solid var(--glass-border);">
            <div id="userInfo"
                style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.75rem; word-break: break-all;">
            </div>
            <button id="logoutBtn" onclick="logout()" class="btn"
                style="width:100%; background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.3); font-size:0.85rem;">
                <i class="ph ph-sign-out"></i> Logout
            </button>
        </div>
    </nav>
    <main class="main-content" style="max-width: 1400px;">
        <header class="page-header animate-in">
            <div>
                <h1 class="page-title">Eisenhower Decision Matrix</h1>
                <p class="page-subtitle">Strategize your tasks based on Urgency and Importance.</p>
            </div>
        </header>

        <div class="glass-card animate-in delay-1" style="margin-bottom: 2rem; padding: 1.5rem;">
            <div class="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <div class="calendar-nav" style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn" style="padding: 0.5rem;" onclick="changeMonth(-1)"><i class="ph ph-caret-left"></i></button>
                    <h2 id="calendarMonthYear" style="margin: 0; min-width: 180px; text-align: center; font-size: 1.25rem;">Month Year</h2>
                    <button class="btn" style="padding: 0.5rem;" onclick="changeMonth(1)"><i class="ph ph-caret-right"></i></button>
                </div>
                <button class="btn" onclick="goToToday()" style="background: rgba(99, 102, 241, 0.1); color: var(--primary); font-size: 0.85rem;">Today</button>
            </div>
            <div id="calendarGrid" class="calendar-grid">
                <div class="calendar-day-label">Sun</div>
                <div class="calendar-day-label">Mon</div>
                <div class="calendar-day-label">Tue</div>
                <div class="calendar-day-label">Wed</div>
                <div class="calendar-day-label">Thu</div>
                <div class="calendar-day-label">Fri</div>
                <div class="calendar-day-label">Sat</div>
                <!-- Days injected by JS -->
            </div>
        </div>

        <div style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;" class="animate-in delay-2">
            <h3 id="selectedDateTitle" style="margin: 0; font-weight: 600; color: var(--text-main);">
                Tasks for Today
            </h3>
            <div style="display: flex; gap: 1rem; font-size: 0.8rem; color: var(--text-muted);">
                <span style="display:flex; align-items:center; gap:0.3rem;"><i class="ph-fill ph-circle" style="color:var(--q1-do)"></i> Q1</span>
                <span style="display:flex; align-items:center; gap:0.3rem;"><i class="ph-fill ph-circle" style="color:var(--q2-schedule)"></i> Q2</span>
                <span style="display:flex; align-items:center; gap:0.3rem;"><i class="ph-fill ph-circle" style="color:var(--q3-delegate)"></i> Q3</span>
                <span style="display:flex; align-items:center; gap:0.3rem;"><i class="ph-fill ph-circle" style="color:var(--q4-eliminate)"></i> Q4</span>
            </div>
        </div>

        <div class="matrix-container animate-in delay-3" id="matrixContainer">
            <!-- Q1: Urgent & Important -->
            <div class="glass-card quadrant q1-border" id="q1">
                <div class="quadrant-header">
                    <div class="quadrant-title q1-bg" style="padding: 0.25rem 0.75rem; border-radius: 8px;">
                        <i class="ph-fill ph-fire"></i> DO FIRST
                    </div>
                </div>
                <div class="quadrant-content" id="q1-tasks">
                    <!-- Tasks injected by JS -->
                </div>
            </div>

            <!-- Q2: Not Urgent & Important -->
            <div class="glass-card quadrant q2-border" id="q2">
                <div class="quadrant-header">
                    <div class="quadrant-title q2-bg" style="padding: 0.25rem 0.75rem; border-radius: 8px;">
                        <i class="ph-fill ph-calendar-star"></i> SCHEDULE
                    </div>
                </div>
                <div class="quadrant-content" id="q2-tasks">
                    <!-- Tasks injected by JS -->
                </div>
            </div>

            <!-- Q3: Urgent & Not Important -->
            <div class="glass-card quadrant q3-border" id="q3">
                <div class="quadrant-header">
                    <div class="quadrant-title q3-bg" style="padding: 0.25rem 0.75rem; border-radius: 8px;">
                        <i class="ph-fill ph-users-three"></i> DELEGATE
                    </div>
                </div>
                <div class="quadrant-content" id="q3-tasks">
                    <!-- Tasks injected by JS -->
                </div>
            </div>

            <!-- Q4: Not Urgent & Not Important -->
            <div class="glass-card quadrant q4-border" id="q4">
                <div class="quadrant-header">
                    <div class="quadrant-title q4-bg" style="padding: 0.25rem 0.75rem; border-radius: 8px;">
                        <i class="ph-fill ph-trash"></i> ELIMINATE
                    </div>
                </div>
                <div class="quadrant-content" id="q4-tasks">
                    <!-- Tasks injected by JS -->
                </div>
            </div>
        </div>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script src="/static/script.js"></script>
</body>

</html>
