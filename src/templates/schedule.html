<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Priority Manager | Matrix Schedule</title>
    <meta name="description" content="View tasks grouped by deadline and sorted by their computed priority score.">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-check-circle"></i>
            TaskMaster
        </div>
        <ul class="nav-links">
            <li><a href="/" class="nav-item" id="nav-dashboard"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="/task.html" class="nav-item" id="nav-task"><i class="ph ph-plus-circle"></i> Add Task</a></li>
            <li><a href="/schedule.html" class="nav-item active" id="nav-schedule"><i class="ph ph-calendar-check"></i> Matrix Schedule</a></li>
            <li><a href="/history.html" class="nav-item" id="nav-history"><i class="ph ph-clock-counter-clockwise"></i> History</a></li>
        </ul>
        <div style="margin-top: auto; padding: 1rem; border-top: 1px solid var(--glass-border);">
            <div id="userInfo" style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.75rem; word-break: break-all;"></div>
            <button id="logoutBtn" onclick="logout()" class="btn" style="width:100%; background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.3); font-size:0.85rem;">
                <i class="ph ph-sign-out"></i> Logout
            </button>
        </div>
    </nav>
    <main class="main-content">
        <header class="page-header animate-in">
            <div>
                <h1 class="page-title">Deadline Schedule</h1>
                <p class="page-subtitle">Tasks grouped by deadline and sorted by Priority Score.</p>
            </div>
        </header>

        <div id="scheduleContainer" class="animate-in delay-1" style="display:flex; flex-direction:column; gap:1.5rem; max-width:800px;">
            <p style="color:var(--text-muted)">Loading schedule…</p>
        </div>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
