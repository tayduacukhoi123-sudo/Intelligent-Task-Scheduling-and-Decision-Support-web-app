<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Priority Manager | Add Task</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-check-circle"></i>
            TaskMaster
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="task.html" class="nav-item active"><i class="ph ph-plus-circle"></i> Add Task</a></li>
            <li><a href="schedule.html" class="nav-item"><i class="ph ph-calendar-check"></i> Matrix Schedule</a></li>
            <li><a href="history.html" class="nav-item"><i class="ph ph-clock-counter-clockwise"></i> History</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="page-header animate-in">
            <div>
                <h1 class="page-title">Evaluate New Task</h1>
                <p class="page-subtitle">Input task parameters to let the algorithm calculate its priority score.</p>
            </div>
        </header>

        <div class="glass-card animate-in delay-1" style="max-width: 800px; margin-bottom: 2rem;">
            <form action="#" id="addTaskForm">
                <div class="form-group">
                    <label class="form-label" for="taskName">Task Name</label>
                    <input type="text" id="taskName" class="form-control" placeholder="e.g. Write weekly report..." required>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label">Urgency (1-10) <span id="urgencyVal" style="float:right; color:var(--primary);">5</span></label>
                        <input type="range" id="uSlider" class="range-slider" min="1" max="10" value="5">
                        <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.5rem; display: block;">How soon does this need to be done?</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Importance (1-10) <span id="importanceVal" style="float:right; color:var(--primary);">5</span></label>
                        <input type="range" id="iSlider" class="range-slider" min="1" max="10" value="5">
                        <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.5rem; display: block;">How much impact does this have?</small>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Severity (1-10) <span id="severityVal" style="float:right; color:var(--primary);">5</span></label>
                        <input type="range" id="sSlider" class="range-slider" min="1" max="10" value="5">
                        <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.5rem; display: block;">Consequence of not doing this?</small>
                    </div>
    
                    <div class="form-group">
                        <label class="form-label" for="taskDate">Deadline</label>
                        <input type="date" id="taskDate" class="form-control" required>
                    </div>
                </div>

                <div style="margin-top: 2rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="submit" class="btn btn-primary"><i class="ph ph-magic-wand"></i> Calculate & Add Task</button>
                </div>
            </form>
        </div>

        <h3 style="margin-bottom: 1rem; color: white;">Active Tasks (Sorted by Priority)</h3>
        <div id="activeTasksContainer" class="animate-in delay-2" style="display: flex; flex-direction: column; gap: 1rem; max-width: 800px;">
            <!-- JS will inject tasks here -->
        </div>

    </main>
    <script src="script.js"></script>
</body>
</html>
