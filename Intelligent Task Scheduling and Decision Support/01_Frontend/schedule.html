<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Priority Manager | Matrix</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-check-circle"></i>
            TaskMaster
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="task.html" class="nav-item"><i class="ph ph-plus-circle"></i> Add Task</a></li>
            <li><a href="schedule.html" class="nav-item active"><i class="ph ph-calendar-check"></i> Matrix Schedule</a></li>
            <li><a href="history.html" class="nav-item"><i class="ph ph-clock-counter-clockwise"></i> History</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="page-header animate-in">
            <div>
                <h1 class="page-title">Deadline Schedule</h1>
                <p class="page-subtitle">Tasks grouped by deadline and sorted by Priority Score.</p>
            </div>
        </header>

        <div id="scheduleContainer" class="animate-in delay-1" style="display:flex; flex-direction:column; gap:1.5rem; max-width:800px;">
            <!-- JS will inject date groups here -->
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
