<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Priority Manager | Sign In</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
<body class="login-body">
    <div class="glass-card login-card">
        <div class="login-brand">
            <i class="ph-fill ph-check-circle"></i> TaskMaster
        </div>
        <p class="login-subtitle">Intelligent Task Scheduling &amp; Decision Support</p>

        <div class="divider"></div>

        <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; font-weight: 500;">
            Sign in with your Google account to access your high-performance workspace.
        </p>

        <!-- Google Identity Services button -->
        <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
            <div id="g_id_onload" data-client_id="280175750348-ok368mrnpn75i9rimpc2lbvls85n448i.apps.googleusercontent.com"
                data-callback="handleGoogleSignIn" data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black"
                data-text="sign_in_with" data-shape="pill" data-logo_alignment="left">
            </div>
        </div>

        <div class="error-msg" id="errorMsg">
            <i class="ph ph-warning-circle"></i> Sign-in failed. Please try again.
        </div>

        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2.5rem; opacity: 0.7;">
            Encrypted connection • Privacy protected
        </p>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="toastContainer" class="toast-container"></div>
    <script>
        // If already logged in, redirect straight to dashboard
        if (localStorage.getItem('user_id')) {
            window.location.href = '/';
        }

        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            if (!container) { alert(message); return; }

            const icons = {
                success: 'ph-fill ph-check-circle',
                error: 'ph-fill ph-x-circle',
                warning: 'ph-fill ph-warning'
            };

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <i class="toast-icon ${icons[type] || icons.warning}"></i>
                <div class="toast-body">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.classList.add('toast-removing'); setTimeout(() => this.parentElement.remove(), 300)">
                    <i class="ph ph-x"></i>
                </button>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.classList.add('toast-removing');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        async function handleGoogleSignIn(response) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                if (!res.ok) throw new Error('Ensure GOOGLE_CLIENT_ID is set in Render environment variables.');

                const data = await res.json();
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('user_name', data.name);
                localStorage.setItem('user_email', data.email);
                window.location.href = '/';
            } catch (err) {
                showToast('error', 'Sign-in Failed', err.message);
            }
        }
    </script>

</body>

</html>
