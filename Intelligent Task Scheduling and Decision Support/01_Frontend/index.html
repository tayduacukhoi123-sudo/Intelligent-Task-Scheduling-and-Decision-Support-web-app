<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Priority Manager | Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-check-circle"></i>
            TaskMaster
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-item active"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="task.html" class="nav-item"><i class="ph ph-plus-circle"></i> Add Task</a></li>
            <li><a href="schedule.html" class="nav-item"><i class="ph ph-calendar-check"></i> Matrix Schedule</a></li>
            <li><a href="history.html" class="nav-item"><i class="ph ph-clock-counter-clockwise"></i> History</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="page-header animate-in">
            <div>
                <h1 class="page-title">Dashboard Overview</h1>
                <p class="page-subtitle">Your productivity at a glance.</p>
            </div>
            <a href="task.html" class="btn btn-primary" style="text-decoration: none;">
                <i class="ph ph-plus"></i> New Task
            </a>
        </header>

        <div class="stats-grid animate-in delay-1" style="grid-template-columns: repeat(3, 1fr);">
            <div class="glass-card stat-card">
                <div class="stat-icon q2-bg"><i class="ph-fill ph-squares-four"></i></div>
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Active Tasks</div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon q3-bg"><i class="ph-fill ph-warning"></i></div>
                <div class="stat-value" id="statNear">0</div>
                <div class="stat-label">Tasks Near Deadline (≤ 2 days)</div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon q1-bg"><i class="ph-fill ph-warning-octagon"></i></div>
                <div class="stat-value" id="statOverdue" style="color: #fca5a5;">0</div>
                <div class="stat-label">Overdue Tasks</div>
            </div>
        </div>

        <div class="glass-card animate-in delay-2" style="margin-bottom: 2rem;">
            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; font-weight: 600;">
                <i class="ph ph-trend-up" style="color: var(--primary)"></i> Top 3 Highest Priority Tasks
            </h3>
            <div id="topTasksContainer" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- JS will inject here -->
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
