<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Priority Manager | History</title>
    <meta name="description" content="Review past completed tasks and their final computed priority scores.">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <nav class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-check-circle"></i>
            TaskMaster
        </div>
        <ul class="nav-links">
            <li><a href="/" class="nav-item" id="nav-dashboard"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="/schedule.html" class="nav-item" id="nav-schedule"><i class="ph ph-calendar-check"></i> Matrix
                    Schedule</a></li>
            <li><a href="/history.html" class="nav-item active" id="nav-history"><i
                        class="ph ph-clock-counter-clockwise"></i> History</a></li>
        </ul>
        <div style="margin-top: auto; padding: 1rem; border-top: 1px solid var(--glass-border);">
            <div id="userInfo"
                style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.75rem; word-break: break-all;">
            </div>
            <button id="logoutBtn" onclick="logout()" class="btn"
                style="width:100%; background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.3); font-size:0.85rem;">
                <i class="ph ph-sign-out"></i> Logout
            </button>
        </div>
    </nav>
    <main class="main-content">
        <header class="page-header animate-in">
            <div>
                <h1 class="page-title">Activity History</h1>
                <p class="page-subtitle">Review past completed tasks and their final priority scores.</p>
            </div>
                <div style="display: flex; gap: 1rem;">
                    <button id="downloadXlsxBtn" onclick="downloadHistoryXLSX()" class="btn" style="background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3);">
                        <i class="ph ph-file-xls"></i> Download XLSX
                    </button>
                    <button id="clearHistoryBtn" onclick="clearHistoryAll()" class="btn"
                        style="background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.3);">
                        <i class="ph ph-trash"></i> Clear All History
                    </button>
                </div>
            </div>
        </header>

        <div class="glass-card animate-in delay-1">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Completed Date</th>
                            <th>Task Title</th>
                            <th>Original Priority</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- History injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="/static/script.js"></script>
</body>

</html>
