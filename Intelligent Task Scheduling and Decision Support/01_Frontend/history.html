<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Priority Manager | History</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-check-circle"></i>
            TaskMaster
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="task.html" class="nav-item"><i class="ph ph-plus-circle"></i> Add Task</a></li>
            <li><a href="schedule.html" class="nav-item"><i class="ph ph-calendar-check"></i> Matrix Schedule</a></li>
            <li><a href="history.html" class="nav-item active"><i class="ph ph-clock-counter-clockwise"></i> History</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="page-header animate-in">
            <div>
                <h1 class="page-title">Activity History</h1>
                <p class="page-subtitle">Review past completed tasks and their final priority scores.</p>
            </div>
            <button class="btn" style="background: rgba(255,255,255,0.05); color: white;">
                <i class="ph ph-funnel"></i> Filter
            </button>
        </header>

        <div class="glass-card table-container animate-in delay-1">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date (Deadline)</th>
                        <th>Task Name</th>
                        <th>Final Score</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- JS will inject completed tasks here -->
                </tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
